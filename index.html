<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lost Sound</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#deddd8;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:35px 20px 80px;
}

/* BRAND */

.brand{
    text-align:center;
    margin-bottom:40px;
}

.brand h1{
    font-size:28px;
    font-weight:500;
    letter-spacing:-1px;
}

.brand p{
    margin-top:4px;
    font-size:11px;
    letter-spacing:2px;
    color:#777;
}

/* LAYOUT */

.showcase{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:start;
}

/* PHONE */

.phone{
    width:350px;
    max-width:100%;
    margin:auto;
    padding:11px;
    background:#171717;
    border-radius:48px;
}

.screen{
    position:relative;
    height:690px;
    overflow:hidden;
    border-radius:37px;
    background:#fffefa;
}

/* NOTCH */

.notch{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:175px;
    height:37px;
    background:#171717;
    border-radius:0 0 20px 20px;
    z-index:10;
}

/* TOP */

.top{
    height:70px;
    padding:43px 18px 0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.logo{
    font-size:13px;
    font-weight:bold;
}

.menu{
    width:22px;
    display:flex;
    flex-direction:column;
    gap:4px;
}

.menu span{
    width:22px;
    height:2px;
    background:#111;
}

/* CONTENT */

.content{
    padding:15px 19px;
}

.main-title{
    font-size:57px;
    line-height:.86;
    font-weight:300;
    letter-spacing:-4px;
    margin-top:10px;
}

.subtitle{
    font-size:8px;
    font-weight:bold;
    letter-spacing:1px;
    margin-top:5px;
    margin-bottom:25px;
}

/* FEATURE */

.feature{
    height:285px;
    position:relative;
}

.main-cover{
    position:absolute;
    left:0;
    top:0;
    width:238px;
    height:238px;
    object-fit:cover;
    z-index:2;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
    transition:.4s ease;
}

/* VINYL */

.vinyl{
    position:absolute;
    left:173px;
    top:21px;
    width:199px;
    height:199px;
    border-radius:50%;

    background:
    repeating-radial-gradient(
        circle,
        #292929 0px,
        #292929 1px,
        #080808 2px,
        #111 4px
    );

    box-shadow:
    0 4px 10px rgba(0,0,0,.3);

    z-index:1;
}

.vinyl::before{
    content:"";
    position:absolute;
    width:42px;
    height:42px;
    left:78px;
    top:78px;
    border-radius:50%;
    background:#d84a43;
}

.vinyl::after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    left:95px;
    top:95px;
    border-radius:50%;
    background:#111;
}

.vinyl.playing{
    animation:rotateDisc 2s linear infinite;
}

@keyframes rotateDisc{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* TRACK INFO */

.track-name{
    position:absolute;
    left:0;
    top:246px;
    font-size:13px;
    font-weight:bold;
}

.track-artist{
    position:absolute;
    left:0;
    top:264px;
    font-size:9px;
    color:#777;
}

.next-cover{
    position:absolute;
    right:-2px;
    top:265px;
    width:60px;
    height:60px;
    object-fit:cover;
    transform:rotate(-8deg);
}

/* POPULAR */

.popular{
    color:#d94a46;
    font-size:12px;
    font-weight:bold;
    margin-bottom:13px;
}

.track-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.track{
    display:grid;
    grid-template-columns:28px 43px 1fr auto;
    align-items:center;
    gap:8px;
    padding:3px;
    border-radius:5px;
    cursor:pointer;
    transition:.2s;
}

.track:hover{
    background:#efeee9;
}

.track.active{
    background:#eeece7;
}

.number{
    text-align:center;
    font-size:9px;
    color:#555;
}

.track-cover{
    width:43px;
    height:43px;
    object-fit:cover;
}

.track-info{
    overflow:hidden;
}

.track-info strong{
    display:block;
    font-size:9px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.track-info small{
    font-size:7px;
    color:#777;
}

.duration{
    font-size:8px;
    color:#555;
}

/* BIG DISC AT BOTTOM */

.bottom-disc{
    position:absolute;
    right:-70px;
    bottom:-150px;
    width:260px;
    height:260px;
    border-radius:50%;

    background:
    repeating-radial-gradient(
        circle,
        #292929 0px,
        #292929 1px,
        #080808 2px,
        #111 4px
    );
}

/* PLAYER */

.player{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:76px;
    background:white;
    border-top:1px solid #e5e2dc;

    display:flex;
    align-items:center;

    padding:10px 14px;
    gap:10px;
}

.player-cover{
    width:48px;
    height:48px;
    object-fit:cover;
}

.player-info{
    flex:1;
    min-width:0;
}

.player-info strong{
    display:block;
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-info span{
    display:block;
    margin-top:3px;
    font-size:8px;
    color:#777;
}

.controls{
    display:flex;
    align-items:center;
    gap:11px;
}

.control{
    border:none;
    background:none;
    font-size:15px;
    cursor:pointer;
}

.play{
    width:39px;
    height:39px;
    border:none;
    border-radius:50%;
    background:#d94a46;
    color:white;
    cursor:pointer;
    font-size:15px;
}

/* PROGRESS */

.progress{
    position:absolute;
    top:-2px;
    left:0;
    width:0%;
    height:2px;
    background:#d94a46;
}

/* MOBILE */

@media(max-width:800px){

    .showcase{
        grid-template-columns:1fr;
        gap:50px;
    }

    .phone{
        width:350px;
    }

}

@media(max-width:370px){

    .page{
        padding-left:10px;
        padding-right:10px;
    }

    .phone{
        width:100%;
    }

    .screen{
        height:650px;
    }

    .main-title{
        font-size:51px;
    }

    .main-cover{
        width:210px;
        height:210px;
    }

    .vinyl{
        width:175px;
        height:175px;
        left:153px;
    }

}
</style>
</head>

<body>

<div class="page">

<header class="brand">

<h1>LOST SOUND</h1>

<p>MUSIC STREAMING</p>

</header>


<div class="showcase">


<!-- ========================= -->
<!-- MAIN PLAYER -->
<!-- ========================= -->

<div class="phone">

<div class="screen">

<div class="notch"></div>


<div class="top">

<div class="logo">
L/S
</div>

<div class="menu">

<span></span>
<span></span>
<span></span>

</div>

</div>


<div class="content">

<h2 class="main-title">
LOST<br>
SOUND
</h2>

<div class="subtitle">

</div>


<div class="feature">

<div
id="vinyl"
class="vinyl">
</div>


<img
id="mainCover"
class="main-cover"

<span></span>
<span></span>

</div>

<div class="subtitle">
PRODUCER · COMPOSER · ARTIST
</div>


<div class="popular">

</div>


<p
style="
font-size:10px;
line-height:2;
color:#777;
">

روی هر موزیک بزن.

<br>

کاور بزرگ تغییر می‌کند،

<script>

const tracks = [

{
name:"YE KHESHAB",
artist:"AMIR TALLES",
duration:"3:36",
cover:"https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=800&q=85",
audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
},

{
name:"BORDERLINE",
artist:"THE LOST RUSH",
duration:"4:12",
cover:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=800&q=85",
audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
},

{
name:"ELEPHANT",
artist:"LOST SOUND",
duration:"3:31",
cover:"https://images.unsplash.com/photo-1524368535928-5b5e00ddc76b?auto=format&fit=crop&w=800&q=85",
audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
},

{
name:"NO CHOICE",
artist:"THE LOST RUSH",
duration:"3:41",
cover:"https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=800&q=85",
audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
}

];


let currentTrack = 0;

const audio = new Audio();


const mainCover =
document.getElementById("mainCover");

const nextCover =
document.getElementById("nextCover");

const trackName =
document.getElementById("trackName");

const trackArtist =
document.getElementById("trackArtist");

const playerCover =
document.getElementById("playerCover");

const playerName =
document.getElementById("playerName");

const playerArtist =
document.getElementById("playerArtist");

const playButton =
document.getElementById("playButton");

const vinyl =
document.getElementById("vinyl");

const progress =
document.getElementById("progress");

const trackList =
document.getElementById("trackList");


function createTrackList(){

trackList.innerHTML = "";

tracks.forEach((track,index)=>{

const item =
document.createElement("div");

item.className =
"track";

if(index === currentTrack){
item.classList.add("active");
}

item.innerHTML = `

<div class="number">
0${index+1}
</div>

<img
class="track-cover"
src="${track.cover}"
>

<div class="track-info">

<strong>
${track.name}
</strong>

<small>
${track.artist}
</small>

</div>

<div class="duration">
${track.duration}
</div>

`;

item.onclick = function(){

selectTrack(index,true);

};

trackList.appendChild(item);

});

}


function selectTrack(index,playNow=false){

currentTrack = index;

const track =
tracks[index];


mainCover.src =
track.cover;

playerCover.src =
track.cover;

nextCover.src =
tracks[(index+1)%tracks.length].cover;


trackName.textContent =
track.name;

trackArtist.textContent =
track.artist;

playerName.textContent =
track.name;

playerArtist.textContent =
track.artist;


audio.src =
track.audio;

audio.load();


createTrackList();


if(playNow){

audio.play()
.then(()=>{

playButton.textContent =
"Ⅱ";

vinyl.classList.add("playing");

})
.catch(()=>{

});

}else{

playButton.textContent =
"▶";

vinyl.classList.remove("playing");

}

}


playButton.onclick =
function(){

if(audio.paused){

audio.play()
.then(()=>{

playButton.textContent =
"Ⅱ";

vinyl.classList.add("playing");

});

}else{

audio.pause();

playButton.textContent =
"▶";

vinyl.classList.remove("playing");

}

};


document.getElementById("previous").onclick =
function(){

let index =
currentTrack - 1;

if(index < 0){
index = tracks.length - 1;
}

selectTrack(index,true);

};


document.getElementById("next").onclick =
function(){

let index =
currentTrack + 1;

if(index >= tracks.length){
index = 0;
}

selectTrack(index,true);

};


audio.addEventListener(
"timeupdate",
function(){

if(audio.duration){

let percent =
(audio.currentTime /
audio.duration) * 100;

progress.style.width =
percent + "%";

}

});


audio.addEventListener(
"ended",
function(){

let index =
currentTrack + 1;

if(index >= tracks.length){
index = 0;
}

selectTrack(index,true);

});


selectTrack(0,false);

</script>

</body>
