<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost Sound</title>

<style>
:root{
  --bg:#dfded9;
  --paper:#fffefa;
  --black:#111;
  --gray:#777;
  --red:#d94a46;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--black);
}

.page{
  max-width:1180px;
  margin:auto;
  padding:35px 25px 80px;
}

.brand{
  text-align:center;
  margin-bottom:40px;
}

.brand h1{
  margin:0;
  font-size:27px;
  font-weight:500;
  letter-spacing:-1.5px;
}

.brand p{
  margin:3px 0;
  font-size:12px;
  letter-spacing:1.5px;
  color:var(--gray);
  font-weight:bold;
}

.showcase{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:75px;
  align-items:start;
}

.phone{
  width:350px;
  max-width:100%;
  margin:auto;
  background:#191919;
  border-radius:48px;
  padding:12px;
}

.screen{
  height:690px;
  position:relative;
  overflow:hidden;
  border-radius:37px;
  background:var(--paper);
}

.notch{
  position:absolute;
  z-index:5;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:178px;
  height:38px;
  background:#191919;
  border-radius:0 0 20px 20px;
}

.top{
  height:70px;
  padding:43px 18px 0;
  display:flex;
  justify-content:space-between;
  direction:ltr;
  font-size:14px;
}

.menu{
  width:22px;
  display:grid;
  gap:3px;
}

.menu i{
  height:2px;
  background:#222;
  width:22px;
}

.content{
  padding:18px 19px;
  direction:ltr;
}

.title{
  font-size:56px;
  line-height:.88;
  font-weight:300;
  letter-spacing:-4px;
  margin:10px 0 3px;
}

.subtitle{
  font-size:8px;
  font-weight:bold;
  letter-spacing:.7px;
  margin-bottom:25px;
}

.feature{
  position:relative;
  height:285px;
}

.cover{
  position:absolute;
  left:0;
  top:0;
  width:238px;
  height:238px;
  object-fit:cover;
  z-index:2;
  box-shadow:0 2px 5px #0002;
  transition:.35s;
}

.vinyl{
  position:absolute;
  z-index:1;
  left:174px;
  top:22px;
  width:198px;
  height:198px;
  border-radius:50%;
  background:
    repeating-radial-gradient(
      circle,
      #242424 0 1px,
      #090909 2px 4px
    );
  transition:.35s;
}

.vinyl:after{
  content:"";
  position:absolute;
  left:82px;
  top:82px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--red);
}

.vinyl.playing{
  animation:spin 2s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.name{
  position:absolute;
  top:245px;
  left:0;
  font-size:13px;
  font-weight:bold;
}

.artist{
  position:absolute;
  top:263px;
  left:0;
  font-size:9px;
  color:var(--gray);
}

.small{
  position:absolute;
  right:-3px;
  top:265px;
  width:61px;
  height:61px;
  object-fit:cover;
  transform:rotate(-8deg);
}

.section{
  color:var(--red);
  font-size:12px;
  font-weight:bold;
  margin:0 0 13px;
}

.tracks{
  display:grid;
  gap:9px;
}

.track{
  display:grid;
  grid-template-columns:28px 43px 1fr auto;
  gap:8px;
  align-items:center;
  cursor:pointer;
  padding:3px 0;
  border-radius:5px;
  transition:.15s;
}

.track:hover,
.track.active{
  background:#f0efea;
}

.num{
  text-align:center;
  font-size:9px;
}

.thumb{
  width:43px;
  height:43px;
  object-fit:cover;
}

.info b{
  display:block;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.info span{
  font-size:7px;
  color:var(--gray);
}

.duration{
  font-size:8px;
  color:#555;
}

.next{
  position:absolute;
  right:18px;
  bottom:16px;
  font-size:8px;
  font-weight:bold;
}

.big-disc{
  position:absolute;
  right:-66px;
  bottom:-145px;
  width:255px;
  height:255px;
  border-radius:50%;
  background:
    repeating-radial-gradient(
      circle,
      #202020 0 1px,
      #080808 2px 4px
    );
}

.player{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:#fff;
  border-top:1px solid #e5e2dc;
  display:flex;
  align-items:center;
  padding:10px 14px;
  gap:10px;
  direction:ltr;
}

.pcover{
  width:48px;
  height:48px;
  object-fit:cover;
}

.now{
  flex:1;
  min-width:0;
}

.now b{
  display:block;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.now span{
  display:block;
  font-size:8px;
  color:#777;
  margin-top:3px;
}

.controls{
  display:flex;
  align-items:center;
  gap:11px;
}

.ctrl{
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.play{
  width:39px;
  height:39px;
  border-radius:50%;
  border:0;
  background:var(--red);
  color:#fff;
  cursor:pointer;
  font-size:16px;
}

.progress{
  position:absolute;
  left:0;
  top:-2px;
  width:0;
  height:2px;
  background:var(--red);
}

@media(max-width:820px){

  .showcase{
    grid-template-columns:1fr;
    gap:55px;
  }

}

@media(max-width:380px){

  .phone{
    padding:9px;
    border-radius:40px;
  }

  .screen{
    border-radius:31px;
  }

  .title{
    font-size:51px;
  }

  .cover{
    width:210px;
    height:210px;
  }

  .vinyl{
    width:175px;
    height:175px;
    left:153px;
  }

}
</style>
</head>

<body>

<main class="page">

<header class="brand">
  <h1>LOST SOUND</h1>
  <p>MUSIC STREAMING</p>
</header>

<section class="showcase">

<!-- PHONE -->
<div class="phone">

<div class="screen">

<div class="notch"></div>

<div class="top">
  <b>S/M</b>

  <span class="menu">
    <i></i>
    <i></i>
    <i></i>
  </span>
</div>

<div class="content">

<h2 class="title">
LOST<br>
SOUND
</h2>

<div class="subtitle">
MUSIC STREAMING
</div>

<div class="feature">

<div id="vinyl" class="vinyl"></div>

<img id="mainCover"
class="cover"
alt="Album Cover">

<div id="mainName" class="name"></div>

<div id="mainArtist" class="artist"></div>

<img id="smallCover"
class="small"
alt="">

</div>

<h3 class="section">
POPULAR
</h3>

<div id="tracks" class="tracks"></div>

</div>

<div class="big-disc"></div>

<div class="next">
NEXT
</div>

<div class="player">

<div id="progress" class="progress"></div>

<img id="playerCover"
class="pcover"
alt="">

<div class="now">

<b id="playerName"></b>

<span id="playerArtist"></span>

</div>

<div class="controls">

<span id="prev" class="ctrl">
◀
</span>

<button id="play" class="play">
▶
</button>

<span id="next" class="ctrl">
▶
</span>

</div>

</div>

</div>

</div>


<!-- SECOND PHONE -->

<div class="phone">

<div class="screen">

<div class="notch"></div>

<div class="top">

<b>S/M</b>

<span class="menu">
<i></i>
<i></i>
<i></i>
</span>

</div>

<div class="content">

<h2 class="title" style="font-size:51px">
AMIR<br>
TALLES
</h2>

<div class="subtitle">
PRODUCER · COMPOSER · ARTIST
</div>

<h3 class="section">
POPULAR
</h3>

<p style="
font-size:9px;
line-height:1.8;
color:#777;
">

برای تست:

<br>

روی هر موزیک بزن.

<br>

کاور اصلی عوض می‌شود.

<br>

موزیک نیز پخش می‌شود.

</p>

</div>

<div class="big-disc"></div>

<div class="next">
NEXT
</div>

</div>

</div>

</section>

</main>


<script>

/* =========================
   MUSIC LIST
========================= */

const tracks = [

{
name:"YE KHESHAB",
artist:"AMIR TALLES",
time:"3:36",

cover:
"https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=700&q=85",

audio:
"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
},

{
name:"BORDERLINE",
artist:"THE LOST RUSH",
time:"4:12",

cover:
"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=700&q=85",

audio:
"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
},

{
name:"ELEPHANT",
artist:"LOST SOUND",
time:"3:31",

cover:
"https://images.unsplash.com/photo-1524368535928-5b5e00ddc76b?auto=format&fit=crop&w=700&q=85",

audio:
"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
},

{
name:"NO CHOICE",
artist:"THE LOST RUSH",
time:"3:41",

cover:
"https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=700&q=85",

audio:
"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
}

];


/* =========================
   AUDIO
========================= */

const audio = new Audio();

let current = 0;


/* =========================
   ELEMENTS
========================= */

const mainCover =
document.getElementById("mainCover");

const smallCover =
document.getElementById("smallCover");

const playerCover =
document.getElementById("playerCover");

const mainName =
document.getElementById("mainName");

const mainArtist =
document.getElementById("mainArtist");

const playerName =
document.getElementById("playerName");

const playerArtist =
document.getElementById("playerArtist");

const tracksContainer =
document.getElementById("tracks");

const vinyl =
document.getElementById("vinyl");

const playButton =
document.getElementById("play");

const progress =
document.getElementById("progress");


/* =========================
   CREATE TRACKS
========================= */

function renderTracks(){

tracksContainer.innerHTML = "";

tracks.forEach((track,index)=>{

const item =
document.createElement("div");

item.className =
"track " +
(index === current ? "active" : "");

item.innerHTML = `

<span class="num">
0${index+1}
</span>

<img
class="thumb"
src="${track.cover}"
>

<div class="info">

<b>
${track.name}
</b>

<span>
${track.artist}
</span>

</div>

<span class="duration">
${track.time}
</span>

`;

item.onclick = function(){

selectTrack(index,true);

};

tracksContainer.appendChild(item);

});

}


/* =========================
   SELECT MUSIC
========================= */

function selectTrack(index,autoPlay){

current = index;

const track =
tracks[index];


/* CHANGE MAIN COVER */

mainCover.src =
track.cover;


/* CHANGE SMALL COVER */

smallCover.src =
tracks[
(index + 1) %
tracks.length
].cover;


/* CHANGE PLAYER COVER */

playerCover.src =
track.cover;


/* CHANGE TEXT */

mainName.textContent =
track.name;

mainArtist.textContent =
track.artist;

playerName.textContent =
track.name;

playerArtist.textContent =
track.artist;


/* CHANGE AUDIO */

audio.src =
track.audio;


/* REFRESH LIST */

renderTracks();


/* PLAY */

if(autoPlay){

audio.play()
.then(()=>{

playButton.textContent = "Ⅱ";

vinyl.classList.add("playing");

})
.catch(()=>{

console.log(
"برای پخش صدا روی صفحه یک بار لمس کنید."
);

});

}else{

playButton.textContent =
"▶";

vinyl.classList.remove(
"playing"
);

}

}


/* =========================
   PLAY BUTTON
========================= */

playButton.onclick = function(){

if(audio.paused){

audio.play()
.then(()=>{

playButton.textContent =
"Ⅱ";

vinyl.classList.add(
"playing"
);

});

}else{

audio.pause();

playButton.textContent =
"▶";

vinyl.classList.remove(
"playing"
);

}

};


/* =========================
   PREVIOUS
========================= */

document.getElementById("prev")
.onclick = function(){

let index =
(current - 1 + tracks.length)
% tracks.length;

selectTrack(index,true);

};


/* =========================
   NEXT
========================= */

document.getElementById("next")
.onclick = function(){

let index =
(current + 1)
% tracks.length;

selectTrack(index,true);

};


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
"timeupdate",
function(){

if(audio.duration){

const percent =
(audio.currentTime /
audio.duration) * 100;

progress.style.width =
percent + "%";

}

});


/* =========================
   AUTO NEXT
========================= */

audio.addEventListener(
"ended",
function(){

let index =
(current + 1)
% tracks.length;

selectTrack(index,true);

});


/* =========================
   START
========================= */

selectTrack(0,false);

</script>

</body>
</html>
